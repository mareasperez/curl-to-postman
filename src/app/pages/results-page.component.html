<main class="h-full flex flex-col gap-0 p-0 md:p-0">
  @if (appState.hasOutput()) {
    <app-output-section
      class="flex-1 min-h-0 flex flex-col"
      [output]="appState.conversionState().output"
      [additionalFiles]="appState.conversionState().additionalFiles"
      [variables]="appState.conversionState().variables"
      [requests]="appState.conversionState().requests"
      [originalRequests]="appState.conversionState().originalRequests || []"
      [editableRequestNames]="appState.editableState().requestNames"
      [editableEnvNames]="appState.editableState().envNames"
      [hasModifiedRequests]="appState.hasModifiedRequests()"
      [hostVariableOverrides]="hostVariableOverrides"
      [tokenVariableOverrides]="tokenVariableOverrides"
      [removedTokenKeys]="removedTokenKeys"
      [duplicateNames]="appState.conversionState().duplicateNames"
      [currentFormat]="currentFormat()"
      [availableFormats]="availableFormats"
      (formatChanged)="onFormatChanged($event)"
      (requestNameChanged)="onRequestNameChanged($event)"
      (envNameChanged)="onEnvNameChanged($event)"
      (requestDetailsUpdated)="onRequestDetailsUpdated($event)"
      (hostVariableUpdated)="onHostVariableUpdated($event)"
      (tokenVariableUpdated)="onTokenVariableUpdated($event)"
      (tokenSanitized)="onTokenSanitized($event)"
      (tokenCleared)="onTokenCleared($event)"
      (tokenRemoveToggled)="onTokenRemoveToggled($event)"
      (requestResetRequested)="onRequestResetRequested($event)"
      (resetAllRequested)="onResetAllRequested()"
      (newConversionClicked)="onNewConversion()"
      (copyRequested)="onCopy($event)"
      (downloadRequested)="onDownload($event)"
    ></app-output-section>
  } @else {
    <div class="empty-state">
      <p>No conversion results available.</p>
      <button (click)="onNewConversion()" class="btn btn-primary">Go to Input</button>
    </div>
  }
</main>
