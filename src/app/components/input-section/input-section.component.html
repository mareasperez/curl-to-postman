<div class="h-full flex flex-col">
    <!-- Input Card -->
    <section class="card flex-1 min-h-0 flex flex-col p-3 md:p-6 mb-0 md:mb-4 overflow-hidden">
        <!-- Header & Toolbar -->
        <div class="flex justify-between items-center mb-4 md:mb-6 flex-wrap gap-4 flex-shrink-0">
            <h2 class="text-xl md:text-2xl font-semibold text-gray-100">📥 Input</h2>
            <div class="flex w-full md:w-auto gap-2">
                <button (click)="onPasteExample()" class="btn btn-secondary flex-1 md:flex-none justify-center" title="Paste example cURL">
                    📋 Paste Example
                </button>
                <button (click)="onClear()" class="btn btn-secondary flex-1 md:flex-none justify-center">
                    Clear
                </button>
            </div>
        </div>

        <!-- Input Area (Fill Remaining Space) -->
        <div class="flex flex-col gap-3 flex-1 min-h-0 overflow-y-auto">
            <textarea [ngModel]="curlInput()" (ngModelChange)="onCurlInputChange($event)"
                class="textarea h-full w-full resize-none min-h-[200px]" placeholder="Paste your cURL commands here (one or multiple)...

Example:
curl 'https://api.example.com/users' \
  -H 'Authorization: Bearer eyJhbGc...' \
  -H 'Content-Type: application/json'

curl 'https://api.example.com/posts' \
  -H 'Authorization: Bearer eyJhbGc...'"></textarea>
            <p class="text-gray-400 text-sm flex-shrink-0 text-right">{{ curlCount() }}</p>
        </div>
    </section>

    <!-- Process Button (Static Stacked) -->
    <div class="flex-shrink-0 p-0 md:static md:p-0 md:bg-transparent md:text-center z-40 border-t border-[var(--border)] md:border-none md:pb-6">
        <button (click)="onProcess()" class="btn btn-primary text-lg w-full md:w-auto px-8 py-3 !rounded-none md:!rounded-full shadow-lg md:shadow-none h-[50px] flex justify-center items-center gap-2">
            <span class="text-xl">⚡</span>
            Process
        </button>
    </div>
</div>
