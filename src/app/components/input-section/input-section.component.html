<div class="input-layout animate-fadeIn">
  <section class="input-card">
    <div class="section-head">
      <div>
        <p class="eyebrow">Input</p>
        <h2>Import your cURL commands</h2>
        <p class="subtext">Paste one or many commands. Processing is fully local.</p>
      </div>
      <div class="head-actions">
        <button type="button" class="ghost-btn" (click)="onPasteExample()">
          <span aria-hidden="true">📌</span>
          <span>Use example</span>
        </button>
        <button type="button" class="ghost-btn" (click)="onClear()">
          <span aria-hidden="true">🧹</span>
          <span>Clear</span>
        </button>
      </div>
    </div>

    <div class="editor-shell">
      <textarea
        [ngModel]="curlInput()"
        (ngModelChange)="onCurlInputChange($event)"
        class="curl-editor custom-scrollbar"
        placeholder="curl 'https://api.example.com/users' -H 'Authorization: Bearer ...'"
      ></textarea>
      <span class="counter">{{ curlCount() }}</span>
    </div>
  </section>

  <div class="cta-wrap">
    <button type="button" class="process-btn" (click)="onProcess()">
      <span aria-hidden="true">⚡</span>
      <span>Convert now</span>
    </button>
  </div>
</div>
