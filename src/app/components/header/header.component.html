<header
    class="relative z-50 w-full border-b border-[var(--border)] bg-[var(--header-bg)] px-6 py-3 shadow-[var(--shadow)]">
    <div class="mx-auto flex w-full flex-wrap items-center justify-between gap-4">
        <div class="flex flex-col gap-1">
            <h1 class="flex items-center gap-2 text-lg font-bold">
                <span class="animate-spin-slow">🔄</span>
                <span class="bg-gradient-to-r from-violet-400 to-blue-400 bg-clip-text text-transparent">
                    cURL to Postman Converter
                </span>
            </h1>
            <p class="text-sm text-[var(--text-muted)]">
                Convert browser cURL commands to Postman collections with automatic variables
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <button (click)="onInfoClick()"
                class="inline-flex items-center gap-2 rounded-full border border-[var(--border)] bg-[var(--button-secondary-bg)] px-4 py-2 text-sm font-semibold text-[var(--text)] shadow-sm transition hover:-translate-y-0.5"
                title="View privacy & info">
                ℹ️ Info
            </button>
            <button (click)="toggleTheme()"
                class="inline-flex items-center gap-2 rounded-full border border-[var(--border)] bg-[var(--button-secondary-bg)] px-4 py-2 text-sm font-semibold text-[var(--text)] shadow-sm transition hover:-translate-y-0.5"
                [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
                <span class="text-base">{{ isDark() ? '🌙' : '☀️' }}</span>
                <span>{{ isDark() ? 'Dark' : 'Light' }}</span>
            </button>
        </div>
    </div>
</header>
