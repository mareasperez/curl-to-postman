<header
    class="relative z-50 w-full border-b border-[var(--border)] bg-[var(--header-bg)] py-3 shadow-[var(--shadow)]">
    <div class="flex w-full flex-wrap items-center justify-between gap-4 px-6">
        <div class="flex flex-col gap-1">
            <h1 class="flex items-center gap-2 text-lg font-bold cursor-pointer transition hover:opacity-80" (click)="goHome()">
                <span class="animate-spin-slow">🔄</span>
                <span class="bg-gradient-to-r from-violet-400 to-blue-400 bg-clip-text text-transparent">
                    cURL to Postman Converter
                </span>
            </h1>
            <p class="text-sm text-[var(--text-muted)]">
                Convert browser cURL commands to Postman collections with automatic variables
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-4">
            <!-- Social Links -->
            <div class="flex items-center gap-3 border-r border-[var(--border)] pr-4 mr-2">
                 <a href="https://github.com/mareasperez" target="_blank"
                    class="flex items-center gap-2 text-sm font-medium text-[var(--text-muted)] hover:text-[var(--text)] transition-colors group">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                    <span class="group-hover:underline">GitHub</span>
                </a>
                <a href="https://linkedin.com/in/mauricio-areas" target="_blank"
                    class="flex items-center gap-2 text-sm font-medium text-[var(--text-muted)] hover:text-[#0077b5] transition-colors group">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    <span class="group-hover:underline">LinkedIn</span>
                </a>
            </div>

            <!-- Action Buttons -->
            <button (click)="onInfoClick()"
                class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-[var(--border)] bg-[var(--button-secondary-bg)] text-[var(--text)] shadow-sm transition hover:bg-[var(--surface-alt)] hover:scale-105"
                title="View info">
                ℹ️
            </button>
            <button (click)="toggleTheme()"
                class="inline-flex items-center justify-center w-10 h-10 rounded-full border border-[var(--border)] bg-[var(--button-secondary-bg)] text-[var(--text)] shadow-sm transition hover:bg-[var(--surface-alt)] hover:scale-105"
                [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
                {{ isDark() ? '🌙' : '☀️' }}
            </button>
        </div>
    </div>
</header>
